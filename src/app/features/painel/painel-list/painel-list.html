<div class="painel-list">
  <h1>Meus painéis</h1>

  @if (carregando) {
    <mat-spinner diameter="32"></mat-spinner>
  } @else {
    <table mat-table [dataSource]="paineis" class="painel-table">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let painel">{{ painel.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="usuarios">
        <th mat-header-cell *matHeaderCellDef>Usuários</th>
        <td mat-cell *matCellDef="let painel">{{ painel.usuarios?.length ?? 0 }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>

    @if (!paineis.length) {
      <p class="painel-empty">Nenhum painel encontrado.</p>
    }
  }
</div>
