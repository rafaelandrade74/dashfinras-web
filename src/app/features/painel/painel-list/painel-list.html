<div class="painel-list">
  <h1>Meus painéis</h1>

  <p-table [value]="paineis" [loading]="carregando" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Nome</th>
        <th>Usuários</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-painel>
      <tr>
        <td>{{ painel.nome }}</td>
        <td>{{ painel.usuarios?.length ?? 0 }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2">Nenhum painel encontrado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
